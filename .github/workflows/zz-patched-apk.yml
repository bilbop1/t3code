name: Patched Android APK (fork only)

on:
  push:
    branches: [apk-build]
  workflow_dispatch:

jobs:
  build:
    if: github.repository != 'pingdotgg/t3code'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      APP_VARIANT: preview
      EXPO_NO_GIT_STATUS: "1"
      NODE_ENV: production
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/emulator /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true

      - uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/mobile...

      - name: Expose pnpm
        run: |
          pnpm_version="$(node --print "require('./package.json').packageManager.split('@').pop()")"
          vp_pnpm_bin="$HOME/.vite-plus/package_manager/pnpm/$pnpm_version/pnpm/bin"
          echo "$vp_pnpm_bin" >> "$GITHUB_PATH"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Prebuild
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --clean --platform android

      - name: Assemble release APK
        working-directory: apps/mobile/android
        run: ./gradlew app:assembleRelease -PreactNativeArchitectures=arm64-v8a

      - uses: actions/upload-artifact@v7
        with:
          name: t3code-preview-patched
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 7
